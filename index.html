<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>โปรไฟล์นักศึกษา - ลดาชมพู อิ่มร้อยเอ็ด</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #dff3ff;
        }

        .card {
            width: 900px;
            max-width: 90%;
            display: flex;
            gap: 30px;
            padding: 30px;
            background-color: #fff4f8;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .profile,
        .todo {
            flex: 1;
            padding: 25px;
            border-radius: 20px;
        }

        .profile {
            background-color: #ffd6e7;
            text-align: center;
        }

        .profile img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ffffff;
        }

        .profile h1 {
            color: #e85d9e;
            font-size: 28px;
        }

        .profile p {
            color: #555555;
            line-height: 1.6;
        }

        .profile a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            background-color: #9edcff;
            color: #333333;
            border-radius: 15px;
        }

        .profile a:hover {
            background-color: #78c9f5;
        }

        .todo {
            background-color: #fff0b8;
        }

        .todo h2 {
            color: #5ba9d6;
            font-size: 28px;
        }

        #todo-input {
            width: 65%;
            padding: 12px;
            border: 2px solid #9edcff;
            border-radius: 10px;
            box-sizing: border-box;
        }

        #add-btn {
            padding: 12px 18px;
            margin-left: 5px;
            border: none;
            border-radius: 10px;
            background-color: #ff9fc5;
            cursor: pointer;
        }

        .todo ul {
            padding-left: 25px;
        }

        .todo li {
            margin: 15px 0;
            color: #555555;
        }

        .todo li button {
            margin-left: 10px;
            padding: 5px 10px;
            border: none;
            border-radius: 8px;
            background-color: #ffb3c6;
        }

        @media (max-width: 700px) {
            .card {
                flex-direction: column;
            }

            #todo-input {
                width: 100%;
                margin-bottom: 10px;
            }

            #add-btn {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile">

            <img src="me.jpg" alt="รูปโปรไฟล์">

            <h1>ลดาชมพู อิ่มร้อยเอ็ด</h1>

            <p>
                รหัสนักศึกษา: 69070178<br>
                สาขา: IT
            </p>

            <p>
                ชื่อเล่นชื่อมัดหมี่
            </p>

            <a href="https://github.com/69070178-maker" target="_blank">
                ช่องทางติดต่อ
            </a>

        </div>

        <div class="todo">

            <h2>To-do List</h2>

            <input
                type="text"
                id="todo-input"
                placeholder="พิมพ์สิ่งที่ต้องทำ..."
            >

            <button type="button" id="add-btn">
                เพิ่ม
            </button>

            <ul id="todo-list">

            </ul>

        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
